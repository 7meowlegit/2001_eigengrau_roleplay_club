
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>2001</title>

    <style>
        #loading {
            display: none;
            margin-top: 15px;
            font-size: 12px;
            color: #777;
        }
        c-t {
        color: black;
        text-align: left;
        jiggle 0.9s steps(2) infinite;
        }
        
        pre a {
                text-decoration: none; color: #b10000;
               text-shadow: #000 2px 2px 1px; padding: 7px;
               display: block; cursor: url('agh.png'), auto;
               outline: outset #590000 1px; background-color: #240000b7; }
        }
        pre a:hover {
        color: #f00; 
        text-shadow: #ff3636 0px 1px 6px;
        transition: all 32ms ease-out; animation: jiggle 0.9s steps(2) infinite;
        }
        @keyframes jiggle { 
        0% { transform: rotate(0.1deg) translate(-0.5px, -0.5px); letter-spacing: -1px; }
        25% { transform: rotate(0.2deg) translate(0.4px, 0.2px); letter-spacing: -1.1px; }
        50% { transform: rotate(-0.1deg) translate(0, 0); letter-spacing: -1.3px; }
        75% { transform: rotate(0.2deg) translate(-1px, -0.5px); letter-spacing: -1.2px; }
        100% { transform: rotate(0.3deg) translate(-0.1px, -0.5px); letter-spacing: -1.3px; }
        }
    </style>
</head>
<body>

<h1>2001wiki</h1>
<c-t>2001office official wiki</c-t>
<hr>

<pre>
<a href="info.html">informations</a>
<a href="locations.html">locations</a>
<a href="entities.html">entities</a>
<a href="items.html">items</a>

<a href="credits.html">/..</a>
</pre>

<div id="loading">pending</div>

<audio id="clicksound" src="assets/clicksound.ogg" preload="auto"></audio>

<script>
const click = document.getElementById("clicksound");
const loading = document.getElementById("loading");

let navigating = false;

document.addEventListener("click", function(e) {
    const link = e.target.closest("a");

    if (!link || navigating) return;

    e.preventDefault();
    navigating = true;

    loading.style.display = "block";

    click.currentTime = 0;
    click.play().catch(() => {});

    setTimeout(function() {
        window.location.href = link.href;
    }, 1000);
});
</script>

<script src="assets/page-effects.js"></script>

</body>
</html>
